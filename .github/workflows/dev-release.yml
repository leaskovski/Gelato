name: Dev Release

# Fork-only: builds a branch or pull request as a prerelease and publishes it in
# a separate plugin repository on the gh-pages branch. Upstream ships real
# releases through release.yml and publish.yml.
#
# Without "ref" it builds the branch the workflow runs on. With a pull request
# number (3 or #3) it builds that pull request's head, with a branch, tag or
# commit that ref. The workflow itself always comes from the branch it runs on,
# so pull requests based on upstream main, which do not have this file, can be
# built from main.
#
# Every ref is its own channel with its own manifest, so a server that installed
# one pull request never auto-updates to a build of another:
#   ref=4          -> channel pr-4  -> gh-pages/pr-4/repository.json
#   ref=feat/x     -> channel feat-x
#   (empty) on main -> channel main
# Jellyfin merges the versions of a plugin across all repositories configured on
# a server and updates to the highest one, so add only one dev channel per server.
# Releases are tagged dev-<channel>-v<version>, and "keep" counts per channel.
#
# Dev versions keep build.yaml's major.minor.patch and turn the last part into
# rev * 1000 + run number, so 0.26.17.1 becomes 0.26.17.1042. That sorts above
# the upstream release the branch is based on and below the next minor bump.
# Run numbers are shared by all channels, so versions within a channel increase
# but are not consecutive.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Pull request number, branch, tag or commit to build (empty = this branch)
        required: false
        default: ""
      keep:
        description: How many dev releases to keep per channel (older ones are deleted)
        required: false
        default: "10"

concurrency:
  group: dev-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dev-release:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_BRANCH: gh-pages
      MANIFEST: repository.json
      KEEP: ${{ inputs.keep || '10' }}
      INPUT_REF: ${{ inputs.ref }}
    steps:
      - name: Resolve what to build
        id: source
        run: |
          ref="${INPUT_REF#\#}"
          if [ -z "$ref" ]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "label=\`$GITHUB_REF_NAME\`" >> "$GITHUB_OUTPUT"
            channel="$GITHUB_REF_NAME"
          elif [[ "$ref" =~ ^[0-9]+$ ]]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ref")
            echo "ref=refs/pull/$ref/head" >> "$GITHUB_OUTPUT"
            echo "label=pull request $ref (\`$(jq -r .head.label <<< "$pr")\`)" >> "$GITHUB_OUTPUT"
            echo "base=$(jq -r .base.ref <<< "$pr")" >> "$GITHUB_OUTPUT"
            channel="pr-$ref"
          else
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "label=\`$ref\`" >> "$GITHUB_OUTPUT"
            channel="$ref"
          fi
          # Used in a tag and a directory name: lower case, anything else becomes "-".
          channel=$(tr '[:upper:]' '[:lower:]' <<< "$channel" | sed -E 's/[^a-z0-9._-]+/-/g; s/^[-.]+//; s/[-.]+$//')
          [ -n "$channel" ] || { echo "Cannot derive a channel from '$ref'"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Channel $channel"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0

      - name: Record commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set dev version
        id: version
        env:
          CHANNEL: ${{ steps.source.outputs.channel }}
        run: |
          base=$(yq '.version' build.yaml)
          IFS=. read -r major minor patch rev <<< "$base"
          version="$major.$minor.$patch.$((rev * 1000 + GITHUB_RUN_NUMBER))"
          tag="dev-$CHANNEL-v$version"
          sed -i "s/^version: .*/version: \"$version\"/" build.yaml
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Dev version $version (based on $base), tag $tag"

      - name: Write release notes
        env:
          CHANNEL: ${{ steps.source.outputs.channel }}
          LABEL: ${{ steps.source.outputs.label }}
          BASE: ${{ steps.source.outputs.base }}
          SHA: ${{ steps.commit.outputs.sha }}
        # Issue references are dropped or put in code spans, so the notes never
        # mention upstream issues and pull requests.
        run: |
          prefix="dev-$CHANNEL-v"
          # Only this channel's tags: "dev-fix-v" also prefixes channel fix-v2's tags, hence the version check.
          prev=$(git tag -l "$prefix*" --sort=-v:refname | while read -r t; do
            [[ "${t#"$prefix"}" =~ ^[0-9]+(\.[0-9]+){3}$ ]] && echo "$t"
          done | head -n1)
          # A pull request lists its own commits: the previous dev build may be of an older head.
          [ -z "$BASE" ] || git fetch origin "$BASE"
          {
            echo "Dev build of $LABEL at ${SHA::7}, channel \`$CHANNEL\`."
            echo
            if [ -n "$BASE" ]; then
              echo "### Commits"
              echo
              git log --no-merges --format='- %s (%h)' "FETCH_HEAD..HEAD"
            elif [ -n "$prev" ] && git merge-base --is-ancestor "$prev" HEAD; then
              echo "### Changes since $prev"
              echo
              git log --no-merges --format='- %s (%h)' "$prev..HEAD"
            else
              echo "### Recent changes"
              echo
              git log --no-merges --format='- %s (%h)' -n 20
            fi
          } | sed -E 's/ \(#[0-9]+\)//g; s/([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)?#[0-9]+/`&`/g' > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.*"

      - name: Build plugin
        id: jprm
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          dotnet-target: "net10.0"

      - name: Create GitHub release
        id: release
        env:
          CHANNEL: ${{ steps.source.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.jprm.outputs.artifact }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          dir=$(dirname "$ZIP")
          name=$(basename "$ZIP")
          (cd "$dir" && md5sum "$name" > "${name%.*}.md5" && sha256sum "$name" > "${name%.*}.sha256")
          gh release create "$TAG" "$ZIP" "$dir/${name%.*}.md5" "$dir/${name%.*}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --prerelease \
            --title "Dev $VERSION ($CHANNEL)" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "checksum=$(cut -c1-32 "$dir/${name%.*}.md5")" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name" >> "$GITHUB_OUTPUT"

      - name: Delete old dev releases of this channel
        id: prune
        env:
          CHANNEL: ${{ steps.source.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prefix="dev-$CHANNEL-v"
          versions=$( { gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name' \
            | while read -r t; do
                [[ "$t" == "$prefix"* ]] || continue
                v="${t#"$prefix"}"
                [[ "$v" =~ ^[0-9]+(\.[0-9]+){3}$ ]] && echo "$v"
              done; echo "$VERSION"; } | sort -u | sort -rV)
          echo "$versions" | tail -n +"$((KEEP + 1))" | while read -r old; do
            [ -n "$old" ] || continue
            echo "Deleting $prefix$old"
            gh release delete "$prefix$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
          echo "kept=$(echo "$versions" | head -n "$KEEP" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

      - name: Update plugin repository manifest
        env:
          CHANNEL: ${{ steps.source.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM: ${{ steps.release.outputs.checksum }}
          SOURCE_URL: ${{ steps.release.outputs.url }}
          KEPT: ${{ steps.prune.outputs.kept }}
        run: |
          pages="$RUNNER_TEMP/pages"
          if git ls-remote --exit-code --heads origin "$PAGES_BRANCH" > /dev/null; then
            git fetch origin "$PAGES_BRANCH"
            git worktree add "$pages" FETCH_HEAD
          else
            git worktree add --detach "$pages"
            git -C "$pages" checkout --orphan "$PAGES_BRANCH"
            git -C "$pages" rm -rfq .
          fi
          manifest="$pages/$CHANNEL/$MANIFEST"
          mkdir -p "$(dirname "$manifest")"
          [ -f "$manifest" ] || echo '[]' > "$manifest"

          # The name stays "Gelato": Jellyfin installs into <name>_<version>, and another name would
          # sit next to the installed plugin instead of replacing it. The overview shows the channel.
          plugin=$(yq -o=json '{"category": .category, "description": .description, "guid": .guid, "name": .name, "overview": .overview, "owner": .owner}' build.yaml \
            | jq --arg channel "$CHANNEL" '.overview += " (dev channel " + $channel + ")"')
          entry=$(jq -n \
            --arg version "$VERSION" \
            --arg targetAbi "$(yq '.targetAbi' build.yaml)" \
            --arg checksum "$CHECKSUM" \
            --arg sourceUrl "$SOURCE_URL" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile changelog "$RUNNER_TEMP/notes.md" \
            '{version: $version, targetAbi: $targetAbi, checksum: $checksum, sourceUrl: $sourceUrl, timestamp: $timestamp, changelog: $changelog}')

          jq --argjson plugin "$plugin" --argjson entry "$entry" --argjson kept "$KEPT" '
            [$plugin + {versions: (
              [$entry] + [(.[0].versions // [])[] | select(.version != $entry.version)]
              | map(select(.version | IN($kept[])))
              | sort_by(.version | split(".") | map(tonumber))
              | reverse
            )}]' "$manifest" > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" "$manifest"
          cat "$manifest"

          cd "$pages"
          git add "$CHANNEL/$MANIFEST"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Dev release $VERSION ($CHANNEL)"
          git push origin "HEAD:$PAGES_BRANCH"

      - name: Summary
        env:
          CHANNEL: ${{ steps.source.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Dev release $VERSION ($CHANNEL)"
            echo
            echo "Plugin repository: \`https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/$PAGES_BRANCH/$CHANNEL/$MANIFEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
